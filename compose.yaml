name: transfer-101

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: transfer_demo
      POSTGRES_PASSWORD: transfer_demo
      POSTGRES_DB: transfer_demo
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer_demo -d transfer_demo"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  postgres-bank:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: mock_bank
      POSTGRES_PASSWORD: mock_bank
      POSTGRES_DB: mock_bank
    ports:
      - "127.0.0.1:54331:5432"
    volumes:
      - mock_bank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mock_bank -d mock_bank"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  postgres-test:
    profiles: ["test"]
    image: postgres:17.11-bookworm
    command: ["postgres", "-c", "max_wal_size=256MB", "-c", "checkpoint_timeout=2min"]
    environment:
      POSTGRES_USER: transfer_test
      POSTGRES_PASSWORD: transfer_test
      POSTGRES_DB: transfer_test
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer_test -d transfer_test"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
  mock_bank_data:
